name: Fix README language switch test

on:
  push:
    branches:
      - agent/hacs-readme-translations
    paths:
      - .github/workflows/fix-readme-switch-test.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hacs-readme-translations
          fetch-depth: 0

      - name: Make every language label non-breaking
        shell: bash
        run: |
          python -m pip install --quiet regex
          python - <<'PY'
          from pathlib import Path
          import html
          import re
          import regex

          path = Path('appendix-what-is-hacs/README.md')
          content = path.read_text(encoding='utf-8')
          first, rest = content.split('\n', 1)

          first = first.replace('<nobr>', '').replace('</nobr>', '')

          def protect(match):
              prefix, label, suffix = match.groups()
              label = html.unescape(label)
              clusters = regex.findall(r'\X', label)
              rendered = []
              for cluster in clusters:
                  if cluster.isspace() or cluster == '\u00a0':
                      rendered.append('&nbsp;')
                  else:
                      rendered.append(html.escape(cluster, quote=False))
              return prefix + '&#8288;'.join(rendered) + suffix

          first = re.sub(r'(<a href="[^"]+">)(.*?)(</a>)', protect, first)
          path.write_text(first + '\n' + rest, encoding='utf-8')

          assert '<nobr>' not in first
          assert '<br>' not in first
          assert '&#8288;' in first
          PY

          rm .github/workflows/fix-readme-switch-test.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add appendix-what-is-hacs/README.md .github/workflows/fix-readme-switch-test.yml
          git commit -m "Keep language labels together [skip ci]"
          git push
